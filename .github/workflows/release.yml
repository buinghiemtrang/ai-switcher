name: Build Ubuntu package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional preview release tag, e.g. v0.12.0-linux.1'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev patchelf sqlite3 lsof zsh
      - run: npm ci
      - run: node tests/installer.test.cjs
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles deb
      - name: Prepare installer checksums
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          root = Path('src-tauri/target/release/bundle/deb')
          packages = sorted(root.glob('*.deb'))
          if not packages:
              raise SystemExit('No Debian installer was built')
          lines = []
          for package in packages:
              target = package.with_name(package.name.replace(' ', '.'))
              if target != package:
                  package.rename(target)
              lines.append(hashlib.sha256(target.read_bytes()).hexdigest() + '  ' + target.name)
          (root / 'SHA256SUMS').write_text('\n'.join(lines) + '\n')
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: ai-switcher-ubuntu-24.04-amd64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/SHA256SUMS
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ai-switcher-ubuntu-24.04-amd64
          path: packages
      - name: Publish preview installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" packages/*.deb packages/SHA256SUMS --target "$RELEASE_SHA" --title "AI switcher $RELEASE_TAG" --notes "Ubuntu 24.04 amd64 preview. See README for support and verification limits." --prerelease
